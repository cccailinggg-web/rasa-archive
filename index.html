<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050505">
  <title>RASA ARCHIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-logo-fix.css">
</head>
<body>
  <main id="app">
    <div class="ink-cloud cloud-a"></div><div class="ink-cloud cloud-b"></div><div class="ink-cloud cloud-c"></div><div class="grain"></div>

    <img class="site-logo" src="assets/wenyi-logo.png" alt="文義復興 CHIAYI">

    <section class="stage screen active" id="homeScreen">
      <button class="home-hit" id="homeStart" type="button">
        <p class="archive-title">RASA ARCHIVE</p>
        <img class="home-card" src="assets/back.png" alt="卡牌背面">
        <span class="tap-hint">Tap to Begin</span>
      </button>
    </section>

    <section class="stage screen" id="quizScreen">
      <div class="quiz-wrap">
        <p class="progress" id="progress">01 / 05</p>
        <h1 id="questionText"></h1>
        <div class="choices">
          <button class="choice" id="choiceA" type="button"></button>
          <button class="choice" id="choiceB" type="button"></button>
          <button class="choice" id="choiceC" type="button"></button>
        </div>
      </div>
    </section>

    <section class="stage screen" id="drawScreen">
      <p class="archive-title draw-title">RASA ARCHIVE</p>
      <div class="card-field" id="cardField">
        <div class="floating-card fc1"><img src="assets/back.png" alt=""></div>
        <div class="floating-card fc2"><img src="assets/back.png" alt=""></div>
        <div class="floating-card fc3"><img src="assets/back.png" alt=""></div>
      </div>
      <button class="primary draw-button" id="drawButton" type="button">Draw Your Archive</button>
    </section>

    <section class="stage screen" id="resultScreen">
      <div class="result-layout">
        <div class="reveal-card" id="revealCard">
          <div class="reveal-inner">
            <img class="card-back" src="assets/back.png" alt="卡牌背面">
            <img class="card-front" id="resultImage" src="assets/card01.png" alt="推薦卡牌">
          </div>
        </div>
        <div class="result-copy">
          <p class="archive-title">RASA ARCHIVE</p>
          <p class="result-label">今晚推薦</p>
          <h2 id="resultName">青蘋序曲</h2>
          <p class="edition" id="resultEdition">Overture</p>
          <p class="result-description" id="resultDescription"></p>
          <div class="archive-notes">
            <p><span>我喜歡的歌曲類型：</span><strong id="songAnswer"></strong></p>
            <p><span>今晚我將為此舉杯！</span><strong id="toastAnswer"></strong></p>
          </div>
          <button class="primary again" id="againButton" type="button">Archive Again</button>
        </div>
      </div>
    </section>

    <dialog id="inventoryDialog">
      <section class="inventory-panel">
        <header>
          <div><p class="inventory-kicker">RASA ARCHIVE</p><h2>庫存管理</h2></div>
          <button class="close-dialog" id="closeInventory" type="button">×</button>
        </header>
        <div class="stock-table" id="stockTable"></div>
        <div class="stock-summary">
          <div><span>已發放總數</span><strong id="issuedTotal">0</strong></div>
          <div><span>預備總數</span><strong id="plannedTotal">51</strong></div>
          <div><span>剩餘總庫存</span><strong id="remainingTotal">51</strong></div>
        </div>
        <div class="dialog-actions">
          <button id="resetStock" type="button">重設為每款 17 杯</button>
          <button id="closeInventoryBottom" type="button">完成</button>
        </div>
      </section>
    </dialog>

    <div class="hold-feedback" id="holdFeedback">
      <span></span><small>持續長按以開啟庫存</small>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
