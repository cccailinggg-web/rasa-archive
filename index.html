<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>RASA ARCHIVE</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="mobile-logo-fix.css"
  >
</head>


<body>

  <main id="app">


    <!-- =====================================================
         背景
    ====================================================== -->

    <div class="ink-cloud cloud-a"></div>

    <div class="ink-cloud cloud-b"></div>

    <div class="ink-cloud cloud-c"></div>

    <div class="grain"></div>



    <!-- =====================================================
         文義復興 Logo
    ====================================================== -->

    <img
      class="site-logo"
      src="assets/wenyi-logo.png"
      alt="文義復興 CHIAYI"
    >



    <!-- =====================================================
         首頁
    ====================================================== -->

    <section
      class="stage screen active"
      id="homeScreen"
    >

      <button
        class="home-hit"
        id="homeStart"
        type="button"
      >

        <img
          class="home-card"
          src="assets/back.png"
          alt="卡牌背面"
        >

        <span class="tap-hint">
          Tap to Begin
        </span>

      </button>

    </section>



    <!-- =====================================================
         五題測驗
    ====================================================== -->

    <section
      class="stage screen"
      id="quizScreen"
    >

      <div class="quiz-wrap">

        <p
          class="progress"
          id="progress"
        >
          01 / 05
        </p>


        <h1 id="questionText"></h1>


        <div class="choices">

          <button
            class="choice"
            id="choiceA"
            type="button"
          ></button>


          <button
            class="choice"
            id="choiceB"
            type="button"
          ></button>


          <button
            class="choice"
            id="choiceC"
            type="button"
          ></button>

        </div>

      </div>

    </section>



    <!-- =====================================================
         抽牌頁
    ====================================================== -->

    <section
      class="stage screen"
      id="drawScreen"
    >

      <div
        class="card-field"
        id="cardField"
      >

        <div class="floating-card fc1">

          <img
            src="assets/back.png"
            alt=""
          >

        </div>


        <div class="floating-card fc2">

          <img
            src="assets/back.png"
            alt=""
          >

        </div>


        <div class="floating-card fc3">

          <img
            src="assets/back.png"
            alt=""
          >

        </div>

      </div>


      <button
        class="primary draw-button"
        id="drawButton"
        type="button"
      >
        Draw Your Archive
      </button>

    </section>



    <!-- =====================================================
         結果頁
    ====================================================== -->

    <section
      class="stage screen"
      id="resultScreen"
    >

      <div class="result-layout">


        <!-- 卡牌 -->

        <div
          class="reveal-card"
          id="revealCard"
        >

          <div class="reveal-inner">

            <img
              class="card-back"
              src="assets/back.png"
              alt="卡牌背面"
            >

            <img
              class="card-front"
              id="resultImage"
              src="assets/card01.png"
              alt="推薦卡牌"
            >

          </div>

        </div>



        <!-- 推薦文字 -->

        <div class="result-copy">

          <p class="archive-title">
            RASA ARCHIVE
          </p>


          <p class="result-label">
            今晚推薦
          </p>


          <h2 id="resultName">
            今夜月色真美
          </h2>


          <p
            class="result-description"
            id="resultDescription"
          ></p>



          <!--
            這兩個答案不影響飲品推薦結果，
            只是把參與者的選擇留在最後的 Archive 中。
          -->

          <div class="archive-notes">

            <p>

              <span>
                關於喜歡，我更接近：
              </span>

              <strong id="songAnswer"></strong>

            </p>


            <p>

              <span>
                今晚我想為此舉杯：
              </span>

              <strong id="toastAnswer"></strong>

            </p>

          </div>



          <button
            class="primary again"
            id="againButton"
            type="button"
          >
            Archive Again
          </button>

        </div>

      </div>

    </section>



    <!-- =====================================================
         庫存管理
         每款 30 杯，共 90 杯
    ====================================================== -->

    <dialog id="inventoryDialog">

      <section class="inventory-panel">


        <header>

          <div>

            <p class="inventory-kicker">
              RASA ARCHIVE
            </p>

            <h2>
              庫存管理
            </h2>

          </div>


          <button
            class="close-dialog"
            id="closeInventory"
            type="button"
          >
            ×
          </button>

        </header>



        <div
          class="stock-table"
          id="stockTable"
        ></div>



        <div class="stock-summary">


          <div>

            <span>
              已發放總數
            </span>

            <strong id="issuedTotal">
              0
            </strong>

          </div>


          <div>

            <span>
              預備總數
            </span>

            <strong id="plannedTotal">
              75
            </strong>

          </div>


          <div>

            <span>
              剩餘總庫存
            </span>

            <strong id="remainingTotal">
              75
            </strong>

          </div>

        </div>



        <div class="dialog-actions">

          <button
            id="resetStock"
            type="button"
          >
            重設為每款 25 杯
          </button>


          <button
            id="closeInventoryBottom"
            type="button"
          >
            完成
          </button>

        </div>

      </section>

    </dialog>



    <!-- =====================================================
         長按開啟庫存提示
    ====================================================== -->

    <div
      class="hold-feedback"
      id="holdFeedback"
    >

      <span></span>

      <small>
        持續長按以開啟庫存
      </small>

    </div>


  </main>



  <!-- =====================================================
       JavaScript
  ====================================================== -->

  <script src="script.js"></script>


</body>

</html>
